name: Video delivery regressions

on:
  pull_request:
    paths:
      - "worker/src/jobs/generate-hook-video*"
      - "worker/src/lib/*video*"
      - "worker/src/lib/generation-provider*"
      - "lib/jobs/**"
      - "lib/ai-studio/**"
      - "app/api/jobs/**"
      - "scripts/check-generation-worker-release*"
      - "scripts/completed-provider-output-recovery-db.test.mjs"
      - "supabase/migrations/*completed_provider_output*"
      - "package*.json"
      - "worker/package*.json"
      - ".github/workflows/video-delivery-regressions.yml"
  push:
    branches: [main]
    paths:
      - "worker/src/jobs/generate-hook-video*"
      - "worker/src/lib/*video*"
      - "worker/src/lib/generation-provider*"
      - "lib/jobs/**"
      - "lib/ai-studio/**"
      - "app/api/jobs/**"
      - "scripts/check-generation-worker-release*"
      - "scripts/completed-provider-output-recovery-db.test.mjs"
      - "supabase/migrations/*completed_provider_output*"
      - "package*.json"
      - "worker/package*.json"
      - ".github/workflows/video-delivery-regressions.yml"

permissions:
  contents: read

jobs:
  completed-video-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run worker:build
      # Fixtures only: no provider credentials, production requests or paid generation.
      - run: node --experimental-test-module-mocks --test worker/dist/lib/reapi-video.test.js worker/dist/lib/generation-provider.test.js worker/src/jobs/generate-hook-video.reapi.test.mjs
      - run: node --import ./scripts/next-server-only-test-loader.mjs --experimental-test-module-mocks --experimental-transform-types --test lib/ai-studio/video-reference-policy.test.ts lib/ai-studio/reference-files.test.ts lib/ai-studio/video-generation-api.test.mjs lib/jobs/background-job-contract.test.ts lib/jobs/background-job-retry-route.test.mjs lib/jobs/generation-retry-credits.test.mjs
      - run: node --test scripts/completed-provider-output-recovery-db.test.mjs scripts/check-generation-worker-release.test.mjs
