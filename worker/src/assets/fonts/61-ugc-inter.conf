<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The bundled variable font declares this family. Keep the renderer's
       public Inter typography contract and let Fontconfig resolve its weights. -->
  <alias binding="strong">
    <family>Inter</family>
    <prefer><family>Inter Variable</family></prefer>
  </alias>
</fontconfig>
