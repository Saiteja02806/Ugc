<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Vercel's Node runtime does not ship a default Fontconfig file. Keep
       Sharp/Pango pointed at the exact Inter asset used by the browser. -->
  <dir prefix="cwd">lib/trending/fonts</dir>
  <cachedir>/tmp</cachedir>
</fontconfig>
