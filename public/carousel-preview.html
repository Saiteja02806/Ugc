<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carousel Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #101214;
        color: #f7f8f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(180deg, #171a1d 0%, #101214 54%, #0c0e10 100%);
      }

      button {
        font: inherit;
      }

      .viewer {
        width: min(100%, 1180px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 28px 32px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 20px;
      }

      .topbar,
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mark {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #f7f8f8;
        color: #101214;
        font-size: 17px;
        font-weight: 800;
      }

      .brand-copy {
        min-width: 0;
      }

      .title {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .meta {
        margin: 3px 0 0;
        overflow: hidden;
        color: #929aa3;
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .state {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #b9c0c7;
        font-size: 13px;
        white-space: nowrap;
      }

      .state::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #31c48d;
        content: "";
      }

      .stage {
        position: relative;
        min-height: 0;
        display: grid;
        place-items: center;
      }

      .slide-frame {
        width: min(100%, 510px);
        aspect-ratio: 4 / 5;
        overflow: hidden;
        border: 1px solid #34393e;
        border-radius: 8px;
        background: #202428;
        box-shadow: 0 28px 80px rgb(0 0 0 / 38%);
        touch-action: pan-y;
        user-select: none;
      }

      .slide {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        opacity: 0;
        transition: opacity 180ms ease;
        -webkit-user-drag: none;
      }

      .slide.loaded {
        opacity: 1;
      }

      .nav {
        position: absolute;
        top: 50%;
        width: 44px;
        height: 44px;
        border: 1px solid #3a4046;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #181b1ecc;
        color: #f7f8f8;
        cursor: pointer;
        font-size: 22px;
        line-height: 1;
        transform: translateY(-50%);
        transition:
          background 140ms ease,
          border-color 140ms ease,
          transform 140ms ease;
      }

      .nav:hover {
        border-color: #69727b;
        background: #252a2f;
      }

      .nav:active {
        transform: translateY(-50%) scale(0.96);
      }

      .nav:disabled {
        cursor: default;
        opacity: 0.3;
      }

      .previous {
        left: max(0px, calc(50% - 320px));
      }

      .next {
        right: max(0px, calc(50% - 320px));
      }

      .footer {
        justify-content: center;
        flex-direction: column;
        gap: 12px;
      }

      .counter {
        color: #b9c0c7;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .dots {
        min-height: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .dot {
        width: 7px;
        height: 7px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #4a5158;
        cursor: pointer;
        transition:
          background 140ms ease,
          transform 140ms ease;
      }

      .dot.active {
        background: #ff6846;
        transform: scale(1.35);
      }

      .error {
        max-width: 560px;
        color: #ffb4a4;
        font-size: 14px;
        text-align: center;
      }

      @media (max-width: 720px) {
        .viewer {
          padding: 16px 14px 22px;
          gap: 14px;
        }

        .state {
          display: none;
        }

        .slide-frame {
          width: min(100%, 430px);
        }

        .nav {
          top: auto;
          bottom: 12px;
          transform: none;
        }

        .nav:active {
          transform: scale(0.96);
        }

        .previous {
          left: 28px;
        }

        .next {
          right: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="viewer">
      <header class="topbar">
        <div class="brand">
          <div class="mark">U</div>
          <div class="brand-copy">
            <h1 class="title">Carousel preview</h1>
            <p class="meta" id="carouselMeta">Loading...</p>
          </div>
        </div>
        <div class="state" id="carouselState">Completed</div>
      </header>

      <section class="stage" aria-live="polite">
        <div class="slide-frame" id="slideFrame">
          <img class="slide" id="slideImage" alt="" />
        </div>
        <button
          class="nav previous"
          id="previousButton"
          type="button"
          aria-label="Previous slide"
          title="Previous slide"
        >
          &#8592;
        </button>
        <button
          class="nav next"
          id="nextButton"
          type="button"
          aria-label="Next slide"
          title="Next slide"
        >
          &#8594;
        </button>
        <p class="error" id="errorMessage" hidden></p>
      </section>

      <footer class="footer">
        <div class="counter" id="counter">0 / 0</div>
        <div class="dots" id="dots" aria-label="Carousel slides"></div>
      </footer>
    </main>

    <script>
      const defaultCarouselId = "79faaf54-1986-401e-ada2-8117cdf15c36";
      const params = new URLSearchParams(window.location.search);
      const carouselId = params.get("carouselId") || defaultCarouselId;
      const image = document.getElementById("slideImage");
      const frame = document.getElementById("slideFrame");
      const previousButton = document.getElementById("previousButton");
      const nextButton = document.getElementById("nextButton");
      const counter = document.getElementById("counter");
      const dots = document.getElementById("dots");
      const meta = document.getElementById("carouselMeta");
      const state = document.getElementById("carouselState");
      const errorMessage = document.getElementById("errorMessage");

      let slides = [];
      let activeIndex = 0;
      let pointerStartX = null;

      function render() {
        const slide = slides[activeIndex];

        if (!slide) {
          return;
        }

        image.classList.remove("loaded");
        image.src = slide.renderedUrl;
        image.alt = `Carousel slide ${slide.slideNumber}: ${slide.headline}`;
        counter.textContent = `${activeIndex + 1} / ${slides.length}`;
        previousButton.disabled = activeIndex === 0;
        nextButton.disabled = activeIndex === slides.length - 1;

        for (const [index, dot] of Array.from(dots.children).entries()) {
          dot.classList.toggle("active", index === activeIndex);
          dot.setAttribute("aria-current", index === activeIndex ? "true" : "false");
        }
      }

      function setActiveIndex(index) {
        activeIndex = Math.min(Math.max(index, 0), slides.length - 1);
        render();
      }

      function createDots() {
        dots.replaceChildren(
          ...slides.map((slide, index) => {
            const dot = document.createElement("button");
            dot.className = "dot";
            dot.type = "button";
            dot.title = `Slide ${slide.slideNumber}`;
            dot.setAttribute("aria-label", `Show slide ${slide.slideNumber}`);
            dot.addEventListener("click", () => setActiveIndex(index));
            return dot;
          }),
        );
      }

      async function loadCarousel() {
        try {
          const response = await fetch(
            `/api/carousel/status?carouselId=${encodeURIComponent(carouselId)}`,
            { cache: "no-store" },
          );
          const data = await response.json();

          if (!response.ok || data.ok !== true) {
            throw new Error(data.message || "Could not load carousel.");
          }

          slides = data.slides.filter((slide) => Boolean(slide.renderedUrl));

          if (slides.length === 0) {
            throw new Error("This carousel has no rendered slides.");
          }

          meta.textContent = `${data.carousel.categorySlug} / ${data.carousel.format} / ${carouselId}`;
          state.textContent = data.carousel.status;
          createDots();
          render();
        } catch (error) {
          frame.hidden = true;
          previousButton.hidden = true;
          nextButton.hidden = true;
          counter.hidden = true;
          state.textContent = "Unavailable";
          errorMessage.hidden = false;
          errorMessage.textContent =
            error instanceof Error ? error.message : "Could not load carousel.";
        }
      }

      image.addEventListener("load", () => image.classList.add("loaded"));
      previousButton.addEventListener("click", () =>
        setActiveIndex(activeIndex - 1),
      );
      nextButton.addEventListener("click", () => setActiveIndex(activeIndex + 1));
      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") {
          setActiveIndex(activeIndex - 1);
        }

        if (event.key === "ArrowRight") {
          setActiveIndex(activeIndex + 1);
        }
      });
      frame.addEventListener("pointerdown", (event) => {
        pointerStartX = event.clientX;
      });
      frame.addEventListener("pointerup", (event) => {
        if (pointerStartX === null) {
          return;
        }

        const delta = event.clientX - pointerStartX;
        pointerStartX = null;

        if (Math.abs(delta) < 45) {
          return;
        }

        setActiveIndex(activeIndex + (delta < 0 ? 1 : -1));
      });
      frame.addEventListener("pointercancel", () => {
        pointerStartX = null;
      });

      loadCarousel();
    </script>
  </body>
</html>
